<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="760" height="180" role="img" aria-label="Before: display A shows workspace 1 and has focus, display B shows workspace 2. After mod-2 on A: A shows 2, B shows 1.">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; }
    .screen { fill: #ffffff; stroke: #cfd4da; stroke-width: 1.5; }
    .stand { fill: #cfd4da; }
    .num { font-size: 32px; font-weight: 650; fill: #1f2328; }
    .label { font-size: 12px; fill: #6e7781; }
    .f .screen { stroke: #1d7d5f; stroke-width: 3; }
    .f .num { fill: #1d7d5f; }
    .glow { fill: none; stroke: #1d7d5f; stroke-opacity: .2; stroke-width: 8; }
    .caption { font-size: 14px; fill: #57606a; }
    .caption tspan { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1f2328; }
    .arrow { fill: none; stroke: #1d7d5f; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .screen { fill: #161b22; stroke: #3d444d; }
      .stand { fill: #3d444d; }
      .num { fill: #f0f6fc; }
      .label { fill: #9198a1; }
      .f .screen { stroke: #2fae84; }
      .f .num { fill: #2fae84; }
      .glow { stroke: #2fae84; }
      .caption { fill: #9198a1; }
      .caption tspan { fill: #f0f6fc; }
      .arrow { stroke: #2fae84; }
    }
  </style>
  <rect class="glow" x="48" y="26" width="138" height="90" rx="13"/>
  <rect class="glow" x="428" y="26" width="138" height="90" rx="13"/>
  <g class="d f">
    <rect class="stand" x="102" y="112" width="30" height="7" rx="2"/>
    <rect class="screen" x="52" y="30" width="130" height="82" rx="10"/>
    <text class="num" x="117" y="79">1</text>
    <text class="label" x="117" y="100">Display A</text>
  </g>
  <g class="d">
    <rect class="stand" x="248" y="112" width="30" height="7" rx="2"/>
    <rect class="screen" x="198" y="30" width="130" height="82" rx="10"/>
    <text class="num" x="263" y="79">2</text>
    <text class="label" x="263" y="100">Display B</text>
  </g>
  <g class="d f">
    <rect class="stand" x="482" y="112" width="30" height="7" rx="2"/>
    <rect class="screen" x="432" y="30" width="130" height="82" rx="10"/>
    <text class="num" x="497" y="79">2</text>
    <text class="label" x="497" y="100">Display A</text>
  </g>
  <g class="d">
    <rect class="stand" x="628" y="112" width="30" height="7" rx="2"/>
    <rect class="screen" x="578" y="30" width="130" height="82" rx="10"/>
    <text class="num" x="643" y="79">1</text>
    <text class="label" x="643" y="100">Display B</text>
  </g>
  <path class="arrow" d="M352 71 H404 M392 59 L404 71 L392 83"/>
  <text class="caption" x="193" y="155">Before: <tspan>mod-2</tspan> on display A</text>
  <text class="caption" x="573" y="155">After: the two displays swapped</text>
</svg>
