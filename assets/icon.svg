<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCF3E3"/>
      <stop offset="1" stop-color="#F1DBB8"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23A47C"/>
      <stop offset="1" stop-color="#0C6650"/>
    </linearGradient>
    <linearGradient id="active" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A8EBD3"/>
      <stop offset="1" stop-color="#46BE96"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A5320"/>
      <stop offset="1" stop-color="#5E3410"/>
    </linearGradient>
    <radialGradient id="fire" cx="0.5" cy="0.75" r="0.7">
      <stop offset="0" stop-color="#FFD27A"/>
      <stop offset="0.45" stop-color="#F59A2B"/>
      <stop offset="1" stop-color="#B8420C"/>
    </radialGradient>
  </defs>

  <!-- macOS icon body -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>

  <!-- ground shadow -->
  <ellipse cx="512" cy="842" rx="236" ry="16" fill="#3D2408" opacity="0.16"/>

  <!-- cornice -->
  <rect x="304" y="212" width="416" height="34" rx="14" fill="url(#wood)"/>
  <rect x="262" y="238" width="500" height="60" rx="18" fill="url(#wood)"/>
  <rect x="280" y="246" width="464" height="8" rx="4" fill="#FFFFFF" opacity="0.18"/>

  <!-- body -->
  <rect x="292" y="292" width="440" height="484" rx="12" fill="#093D31"/>

  <!-- nine glazed tiles = nine workspaces -->
  <g>
    <rect x="308" y="308" width="128" height="142" rx="14" fill="url(#tile)"/>
    <rect x="448" y="308" width="128" height="142" rx="14" fill="url(#tile)"/>
    <rect x="588" y="308" width="128" height="142" rx="14" fill="url(#tile)"/>
    <rect x="308" y="462" width="128" height="142" rx="14" fill="url(#tile)"/>
    <rect x="448" y="462" width="128" height="142" rx="14" fill="url(#active)"/>
    <rect x="588" y="462" width="128" height="142" rx="14" fill="url(#tile)"/>
    <rect x="308" y="616" width="128" height="142" rx="14" fill="url(#tile)"/>
    <rect x="448" y="616" width="128" height="142" rx="14" fill="#0B4B3C"/>
    <rect x="588" y="616" width="128" height="142" rx="14" fill="url(#tile)"/>
  </g>
  <!-- glaze highlights -->
  <g fill="#FFFFFF" opacity="0.22">
    <rect x="322" y="322" width="54" height="12" rx="6"/>
    <rect x="462" y="322" width="54" height="12" rx="6"/>
    <rect x="602" y="322" width="54" height="12" rx="6"/>
    <rect x="322" y="476" width="54" height="12" rx="6"/>
    <rect x="602" y="476" width="54" height="12" rx="6"/>
    <rect x="322" y="630" width="54" height="12" rx="6"/>
    <rect x="602" y="630" width="54" height="12" rx="6"/>
  </g>
  <rect x="462" y="476" width="54" height="12" rx="6" fill="#FFFFFF" opacity="0.5"/>

  <!-- fire door -->
  <path d="M474 744 V674 a38 38 0 0 1 76 0 V744 Z" fill="url(#fire)"/>
  <path d="M474 744 V674 a38 38 0 0 1 76 0 V744" fill="none" stroke="#3A2006" stroke-width="8"/>
  <rect x="468" y="740" width="88" height="10" rx="5" fill="#3A2006"/>

  <!-- plinth and feet -->
  <rect x="270" y="770" width="484" height="40" rx="12" fill="url(#wood)"/>
  <rect x="314" y="806" width="62" height="28" rx="6" fill="#4A280A"/>
  <rect x="648" y="806" width="62" height="28" rx="6" fill="#4A280A"/>
</svg>
