name: CI
on:
  push:
  pull_request:
jobs:
  build:
    # Every macOS GitHub has, Apple Silicon and Intel: the tests (including the
    # window manager against fakes and the UI checks) and a start of the real app.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build (APIs newer than the minimum macOS are an error)
        run: |
          sw_vers; uname -m
          swift build --build-tests 2>&1 | tee build.log
          if grep -E "only available in macOS|is unavailable in macOS" build.log; then
            echo "::error::uses an API that's newer than Kachel's minimum macOS"; exit 1
          fi
      - run: swift test
      - run: ./scripts/bundle.sh
      - run: ./scripts/smoke-test.sh
