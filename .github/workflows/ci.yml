name: CI
on:
  push:
  pull_request:
jobs:
  build:
    # Kachel needs macOS 26 (Liquid Glass): Apple Silicon, and Intel (macOS 26 is
    # the last version for Intel Macs) if GitHub offers it.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build (APIs newer than the minimum macOS are an error)
        run: |
          sw_vers; uname -m
          swift build --build-tests 2>&1 | tee build.log
          if grep -E "only available in macOS|is unavailable in macOS" build.log; then
            echo "::error::uses an API that's newer than Kachel's minimum macOS"; exit 1
          fi
      - run: swift test
      - run: ./scripts/bundle.sh
      - run: ./scripts/smoke-test.sh
