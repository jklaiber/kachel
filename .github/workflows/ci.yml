name: CI
on:
  push:
  pull_request:
jobs:
  build:
    # Kachel needs macOS 26 (Liquid Glass): Apple Silicon, and Intel (macOS 26 is
    # the last version for Intel Macs) if GitHub offers it.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build (APIs newer than the minimum macOS are an error)
        run: |
          sw_vers; uname -m
          swift build --build-tests 2>&1 | tee build.log
          if grep -E "only available in macOS|is unavailable in macOS" build.log; then
            echo "::error::uses an API that's newer than Kachel's minimum macOS"; exit 1
          fi
      # GitHub's Intel Macs are virtual and have no usable graphics: windows with
      # Liquid Glass and alerts hang there. Drawing is the same on both, so the
      # UI tests and the app start run on Apple Silicon; Intel builds and runs
      # all the other tests.
      - name: Tests
        run: |
          if [ "${{ matrix.os }}" = "macos-26-intel" ]; then swift test --skip UITests
          else swift test; fi
      - run: ./scripts/bundle.sh
      - name: Start the app
        if: matrix.os != 'macos-26-intel'
        run: ./scripts/smoke-test.sh
